.chip.on{color:var(--wx-primary);border-color:var(--wx-primary);background:var(--blue-s)}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tk{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 9px}.tk .k{font-size:10px;color:var(--muted)}.tk .v{font-size:16px;font-weight:700;margin-top:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:7px 15px;border-radius:16px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
.toast.show{opacity:1}.toast.warn{background:var(--red)}
.hint{position:fixed;left:70px;bottom:14px;z-index:70;font-size:11px;color:#fff;background:rgba(51,112,255,.92);padding:5px 11px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
/* ============ 客户动态 · 小程序会员等级/积分 ============ */
.sect .slk{float:right;font-size:10px;color:var(--wx-primary);cursor:pointer;font-weight:500}
.sect .slk:hover{text-decoration:underline}
.thline{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.6;background:var(--panel2);border:1px dashed var(--border);border-radius:7px;padding:6px 8px}
.thline b{color:var(--wx-text2);font-weight:600}
.memcard{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 11px}
.memcard .mbg{width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--panel);border:1px solid var(--border)}
.memcard .mmd{flex:1;min-width:0}
.memcard .mlv{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.memcard .mlv em{font-style:normal;font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px}
.memcard .mrt{font-size:10px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memcard .mbar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.memcard .mbar i{display:block;height:100%;border-radius:2px}
.memcard .mup{font-size:9px;color:var(--muted);margin-top:3px}
.memcard .mpt{flex:none;text-align:right}
.memcard .mpt .p1{font-size:15px;font-weight:700;color:var(--gold);line-height:1.1}
.memcard .mpt .p2{font-size:9px;color:var(--muted)}
/* ============ 参数管理弹窗 · 项目册判定口径 ============ */
.pm-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;display:none;align-items:center;justify-content:center;padding:24px}
.pm-mask.open{display:flex}
.pm-panel{width:100%;max-width:860px;max-height:100%;background:var(--panel);border-radius:12px;box-shadow:0 12px 48px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.pm-hd{padding:14px 18px 11px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.pm-hd .pt{font-size:14px;font-weight:600}
.pm-hd .pd{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.pm-hd .px{margin-left:auto;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 4px}
.pm-hd .px:hover{color:var(--wx-text)}
.pm-bd{flex:1;overflow-y:auto;padding:12px 18px 16px}
.pm-tb{width:100%;border-collapse:collapse;font-size:11px}
.pm-tb th{font-size:10px;color:var(--muted);font-weight:500;text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
.pm-tb td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.pm-tb tr:last-child td{border-bottom:0}
.pm-tb tr.pm-def{background:var(--blue-s)}
.pm-tb tr.pm-def .pn{color:var(--wx-primary);font-weight:600}
.pm-tb .pn{font-weight:600;white-space:nowrap}
.pm-tb td.num{text-align:center}
.pm-inp{width:62px;height:26px;text-align:center;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--wx-text);font-size:11px;outline:none}
.pm-inp:focus{border-color:var(--wx-primary)}
.pm-inp:disabled{opacity:.45;cursor:not-allowed}
.pm-sw{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);cursor:pointer;user-select:none}
.pm-sw input{margin:0;cursor:pointer}
.pm-sw.on{color:var(--wx-primary)}
.pm-badge{font-size:9px;padding:1px 7px;border-radius:8px;font-weight:600}
.pm-badge.d{color:var(--muted);background:var(--input);border:1px solid var(--border)}
.pm-badge.c{color:var(--wx-primary);background:var(--blue-s);border:1px solid var(--wx-primary)}
.pm-rst{font-size:10px;color:var(--wx-primary);cursor:pointer}
.pm-rst.dis{color:var(--muted);cursor:default;opacity:.5}
.pm-sub{font-size:12px;font-weight:600;margin:16px 0 7px;display:flex;align-items:center;gap:7px}
.pm-sub::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--wx-primary)}
.pm-tip{font-size:10px;color:var(--muted);line-height:1.6;background:var(--panel2);border:1px dashed var(--border);border-radius:7px;padding:7px 9px;margin-top:8px}
.pm-tip b{color:var(--wx-text2)}
.pm-ft{padding:10px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.pm-ft .sp{flex:1;font-size:10px;color:var(--muted)}
.pm-btn{height:30px;padding:0 16px;border-radius:6px;font-size:12px;border:1px solid var(--border);background:var(--panel);color:var(--wx-text2)}
.pm-btn:hover{border-color:var(--muted)}
.pm-btn.pri{background:var(--wx-primary);color:#fff;border-color:var(--wx-primary)}
.pm-cnt{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:var(--input);color:var(--muted);font-size:10px;margin-left:4px}
/* ============ 客户标签 · 企微官版三大类（企业/系统/个人） ============ */
.tq{position:relative;margin-bottom:10px}
.tq input{width:100%;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--input);padding:0 9px 0 28px;font-size:11px;color:var(--wx-text);outline:none}
.tq input:focus{border-color:var(--wx-primary)}
.tq svg{position:absolute;left:8px;top:7px;width:15px;height:15px;color:var(--muted)}
.tcat{margin:12px 0 4px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tcat:first-of-type{margin-top:0}
.tcat i{width:8px;height:8px;border-radius:2px;flex:none}
.tcat .cn{font-size:9px;color:var(--muted);font-weight:400;margin-left:auto}
.tgname{font-size:10px;color:var(--muted);margin:8px 0 5px}
.tagmore{font-size:10px;color:var(--wx-primary);cursor:pointer;padding:2px 0}
.tagfoot{position:sticky;bottom:-11px;margin:10px -13px -11px;padding:8px 13px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;z-index:2}
.tagfoot .cnt{flex:1;font-size:11px;color:var(--muted)}
.tagfoot .cnt b{color:var(--wx-primary)}
.tbtn{height:28px;padding:0 16px;border-radius:6px;font-size:11px;border:1px solid var(--border);background:var(--panel);color:var(--wx-text2);flex:none}
.tbtn:hover{border-color:var(--muted)}
.tbtn.pri{background:var(--wx-primary);color:#fff;border-color:var(--wx-primary)}
/* ============ 话术库 · 双列（左分类/右列表） ============ */
.sc-wrap{display:flex;gap:9px}
.sc-side{width:76px;flex:none;display:flex;flex-direction:column;gap:4px}
.sc-ci{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:8px;font-size:11px;color:var(--muted);cursor:pointer;border:1px solid transparent}
.sc-ci:hover{background:var(--input)}
.sc-ci.on{background:var(--blue-s);color:var(--wx-primary);font-weight:600}
.sc-ci .n{font-size:9px;background:var(--input);border-radius:8px;min-width:15px;text-align:center;padding:0 4px;line-height:15px;font-weight:500}
.sc-ci.on .n{background:var(--wx-primary);color:#fff}
.sc-main{flex:1;min-width:0}
/* ============ 群聊信息 · 对齐个微 PC 群聊界面 ============ */
.anno{border:1px solid var(--border);border-radius:10px;background:var(--gold-s);padding:9px 11px}
.anno .at{font-size:12px;font-weight:600;margin-bottom:3px;line-height:1.5}
.anno .am{font-size:9px;color:var(--muted);margin-top:5px}
.gset{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed var(--border);font-size:12px}
.gset:last-child{border-bottom:0}
.gset .gk{color:var(--wx-text2)}
.sw{width:34px;height:19px;border-radius:10px;background:var(--border);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw i{position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}
.sw.on i{left:17px}
.gact{font-size:10px;color:var(--wx-primary);cursor:pointer}
html,body{width:100%;height:100%;overflow:hidden}
.hint{top:0;right:0;bottom:auto;left:0;height:24px;display:flex;align-items:center;justify-content:center;border-radius:0;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-app{height:calc(100vh - 24px);margin-top:24px}</style>

 h+='</div>';
 /* ③ 操作人分布 */
 h+='<div class="sect">操作人分布</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">';
 bylist.forEach(function(b){h+='<span class="tagchip on">'+esc(b)+' · '+bys[b]+'</span>'});
 h+='</div>';
 h+='<div class="note">📊 跟进日志由系统自动抓取账号行为轨迹（电话 / 微信 / 面访 / 素材发送 / 充值 / 打标 / 添加等），<b>无需人工手动录入</b>，数据可同步至后台审计与质检调取。<br>🕘 时间线优先展示最新行为，便于先看「最近发生了什么」；类型分布与操作人分布作为统计补充。<br>🧩 默认展示类型项：<b>跟进 / 充值 / 素材 / 添加 / 打标 / 客诉</b>（按此顺序统计排序，类型集合待产品确认）。</div>';
